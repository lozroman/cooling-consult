<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 379" role="img" aria-labelledby="title desc">
  <title id="title">Чиллер — три одинаковых потребителя</title>
  <desc id="desc">Чиллер, расширительный бак и один насос. Три одинаковые параллельные ветви между коллекторами подачи 7 °C и возврата 12 °C. На каждой ветви два крана.</desc>
  <g font-family="Inter, Arial, sans-serif" fill="#16212c">
    <path d="M101 40 H32 V334" fill="none" stroke="#234ac2" stroke-width="2.8" stroke-linejoin="round" stroke-linecap="round"/>
    <path d="M299 40 H368 V334" fill="none" stroke="#ad4e2a" stroke-width="2.8" stroke-linejoin="round" stroke-linecap="round"/>
    <g class="source"><rect x="101" y="20" width="198" height="40" rx="2" fill="#fff" stroke="#16212c" stroke-width="1.9"/><text x="200" y="46" text-anchor="middle" font-size="18" font-weight="650" fill="#16212c">Чиллер</text></g>
    <path class="flow" transform="translate(66 40) rotate(180)" d="M-5 -4.8 L4.5 0 L-5 4.8 Z" fill="#234ac2"/>
    <g class="temperatures"><text x="66" y="26" text-anchor="middle" font-size="17" font-weight="650" fill="#234ac2">7 °C</text><text x="335" y="26" text-anchor="middle" font-size="17" font-weight="650" fill="#ad4e2a">12 °C</text></g>
    <g class="expansion"><title>Мембранный бак подключён к всасывающей линии насоса</title><path d="M32 110 H111 V104" fill="none" stroke="#234ac2" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/><circle cx="32" cy="110" r="3.6" fill="#234ac2"/><rect x="96" y="73" width="30" height="31" rx="13" fill="#fff" stroke="#16212c" stroke-width="1.9"/><path d="M97 89 q14 -6 28 0" fill="none" stroke="#16212c" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round"/><text x="137" y="93" text-anchor="start" font-size="16" font-weight="400" fill="#16212c">Расширительный бак</text></g>
    <g class="valve"><title>Насос — всасывающая линия</title><path transform="translate(32 127) rotate(90)" d="M-7.2 -5.3 L0 0 L-7.2 5.3 Z M7.2 -5.3 L0 0 L7.2 5.3 Z" fill="#fff" stroke="#16212c" stroke-width="1.65" stroke-linejoin="round"/></g>
    <g class="pump"><title>Насос</title><circle cx="32" cy="154" r="13.4" fill="#fff" stroke="#234ac2" stroke-width="2.4"/><path d="M23.7 148.3 h16.6 l-8.3 15 Z" fill="#234ac2"/><text x="57" y="159.8" text-anchor="start" font-size="17" font-weight="400" fill="#16212c">Насос</text></g>
    <g class="valve"><title>Насос — напорная линия</title><path transform="translate(32 182) rotate(90)" d="M-7.2 -5.3 L0 0 L-7.2 5.3 Z M7.2 -5.3 L0 0 L7.2 5.3 Z" fill="#fff" stroke="#16212c" stroke-width="1.65" stroke-linejoin="round"/></g>
    <path class="flow" transform="translate(368 148) rotate(270)" d="M-5 -4.8 L4.5 0 L-5 4.8 Z" fill="#ad4e2a"/>
    <g class="valve"><title>Вход в чиллер — общий возврат</title><path transform="translate(335 40) rotate(0)" d="M-7.2 -5.3 L0 0 L-7.2 5.3 Z M7.2 -5.3 L0 0 L7.2 5.3 Z" fill="#fff" stroke="#16212c" stroke-width="1.65" stroke-linejoin="round"/></g>
    <path d="M32 226 H118" fill="none" stroke="#234ac2" stroke-width="2.8" stroke-linejoin="round" stroke-linecap="round"/>
    <path d="M282 226 H368" fill="none" stroke="#ad4e2a" stroke-width="2.8" stroke-linejoin="round" stroke-linecap="round"/>
    <circle cx="32" cy="226" r="3.6" fill="#234ac2"/>
    <circle cx="368" cy="226" r="3.6" fill="#ad4e2a"/>
    <g class="valve"><title>Потребитель 1 — подача</title><path transform="translate(72 226) rotate(0)" d="M-7.2 -5.3 L0 0 L-7.2 5.3 Z M7.2 -5.3 L0 0 L7.2 5.3 Z" fill="#fff" stroke="#16212c" stroke-width="1.65" stroke-linejoin="round"/></g>
    <path class="flow" transform="translate(96 226) rotate(0)" d="M-5 -4.8 L4.5 0 L-5 4.8 Z" fill="#234ac2"/>
    <path class="flow" transform="translate(304 226) rotate(0)" d="M-5 -4.8 L4.5 0 L-5 4.8 Z" fill="#ad4e2a"/>
    <g class="valve"><title>Потребитель 1 — возврат</title><path transform="translate(334 226) rotate(0)" d="M-7.2 -5.3 L0 0 L-7.2 5.3 Z M7.2 -5.3 L0 0 L7.2 5.3 Z" fill="#fff" stroke="#16212c" stroke-width="1.65" stroke-linejoin="round"/></g>
    <g class="consumer"><title>Потребитель 1</title><rect x="118" y="208" width="164" height="36" rx="2" fill="#fff" stroke="#16212c" stroke-width="1.9"/><text x="200" y="232" text-anchor="middle" font-size="17" font-weight="550" fill="#16212c">Потребитель 1</text></g>
    <path d="M32 280 H118" fill="none" stroke="#234ac2" stroke-width="2.8" stroke-linejoin="round" stroke-linecap="round"/>
    <path d="M282 280 H368" fill="none" stroke="#ad4e2a" stroke-width="2.8" stroke-linejoin="round" stroke-linecap="round"/>
    <circle cx="32" cy="280" r="3.6" fill="#234ac2"/>
    <circle cx="368" cy="280" r="3.6" fill="#ad4e2a"/>
    <g class="valve"><title>Потребитель 2 — подача</title><path transform="translate(72 280) rotate(0)" d="M-7.2 -5.3 L0 0 L-7.2 5.3 Z M7.2 -5.3 L0 0 L7.2 5.3 Z" fill="#fff" stroke="#16212c" stroke-width="1.65" stroke-linejoin="round"/></g>
    <path class="flow" transform="translate(96 280) rotate(0)" d="M-5 -4.8 L4.5 0 L-5 4.8 Z" fill="#234ac2"/>
    <path class="flow" transform="translate(304 280) rotate(0)" d="M-5 -4.8 L4.5 0 L-5 4.8 Z" fill="#ad4e2a"/>
    <g class="valve"><title>Потребитель 2 — возврат</title><path transform="translate(334 280) rotate(0)" d="M-7.2 -5.3 L0 0 L-7.2 5.3 Z M7.2 -5.3 L0 0 L7.2 5.3 Z" fill="#fff" stroke="#16212c" stroke-width="1.65" stroke-linejoin="round"/></g>
    <g class="consumer"><title>Потребитель 2</title><rect x="118" y="262" width="164" height="36" rx="2" fill="#fff" stroke="#16212c" stroke-width="1.9"/><text x="200" y="286" text-anchor="middle" font-size="17" font-weight="550" fill="#16212c">Потребитель 2</text></g>
    <path d="M32 334 H118" fill="none" stroke="#234ac2" stroke-width="2.8" stroke-linejoin="round" stroke-linecap="round"/>
    <path d="M282 334 H368" fill="none" stroke="#ad4e2a" stroke-width="2.8" stroke-linejoin="round" stroke-linecap="round"/>
    <g class="valve"><title>Потребитель 3 — подача</title><path transform="translate(72 334) rotate(0)" d="M-7.2 -5.3 L0 0 L-7.2 5.3 Z M7.2 -5.3 L0 0 L7.2 5.3 Z" fill="#fff" stroke="#16212c" stroke-width="1.65" stroke-linejoin="round"/></g>
    <path class="flow" transform="translate(96 334) rotate(0)" d="M-5 -4.8 L4.5 0 L-5 4.8 Z" fill="#234ac2"/>
    <path class="flow" transform="translate(304 334) rotate(0)" d="M-5 -4.8 L4.5 0 L-5 4.8 Z" fill="#ad4e2a"/>
    <g class="valve"><title>Потребитель 3 — возврат</title><path transform="translate(334 334) rotate(0)" d="M-7.2 -5.3 L0 0 L-7.2 5.3 Z M7.2 -5.3 L0 0 L7.2 5.3 Z" fill="#fff" stroke="#16212c" stroke-width="1.65" stroke-linejoin="round"/></g>
    <g class="consumer"><title>Потребитель 3</title><rect x="118" y="316" width="164" height="36" rx="2" fill="#fff" stroke="#16212c" stroke-width="1.9"/><text x="200" y="340" text-anchor="middle" font-size="17" font-weight="550" fill="#16212c">Потребитель 3</text></g>
  </g>
</svg>
