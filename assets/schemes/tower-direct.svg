<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 283" role="img" aria-labelledby="title desc">
  <title id="title">Градирня — прямое подключение потребителя</title>
  <desc id="desc">Насос забирает воду из встроенного поддона открытой градирни. Из потребителя вода возвращается на орошение. На схеме два крана у насоса и один на возврате.</desc>
  <g font-family="Inter, Arial, sans-serif" fill="#16212c">
    <path d="M101 40 H32 V238" fill="none" stroke="#234ac2" stroke-width="2.8" stroke-linejoin="round" stroke-linecap="round"/>
    <path d="M299 40 H368 V238" fill="none" stroke="#ad4e2a" stroke-width="2.8" stroke-linejoin="round" stroke-linecap="round"/>
    <g class="source"><rect x="101" y="16" width="198" height="48" rx="2" fill="#fff" stroke="#16212c" stroke-width="1.9"/><text x="200" y="39" text-anchor="middle" font-size="18" font-weight="650" fill="#16212c">Градирня</text><text x="200" y="56" text-anchor="middle" font-size="14" font-weight="400" fill="#475969">встроенный поддон</text></g>
    <path class="flow" transform="translate(66 40) rotate(180)" d="M-5 -4.8 L4.5 0 L-5 4.8 Z" fill="#234ac2"/>
    <g class="valve"><title>Насос — всасывающая линия</title><path transform="translate(32 127) rotate(90)" d="M-7.2 -5.3 L0 0 L-7.2 5.3 Z M7.2 -5.3 L0 0 L7.2 5.3 Z" fill="#fff" stroke="#16212c" stroke-width="1.65" stroke-linejoin="round"/></g>
    <g class="pump"><title>Насос</title><circle cx="32" cy="154" r="13.4" fill="#fff" stroke="#234ac2" stroke-width="2.4"/><path d="M23.7 148.3 h16.6 l-8.3 15 Z" fill="#234ac2"/><text x="57" y="159.8" text-anchor="start" font-size="17" font-weight="400" fill="#16212c">Насос</text></g>
    <g class="valve"><title>Насос — напорная линия</title><path transform="translate(32 182) rotate(90)" d="M-7.2 -5.3 L0 0 L-7.2 5.3 Z M7.2 -5.3 L0 0 L7.2 5.3 Z" fill="#fff" stroke="#16212c" stroke-width="1.65" stroke-linejoin="round"/></g>
    <path class="flow" transform="translate(368 148) rotate(270)" d="M-5 -4.8 L4.5 0 L-5 4.8 Z" fill="#ad4e2a"/>
    <path class="flow" transform="translate(335 40) rotate(180)" d="M-5 -4.8 L4.5 0 L-5 4.8 Z" fill="#ad4e2a"/>
    <path d="M32 238 H118" fill="none" stroke="#234ac2" stroke-width="2.8" stroke-linejoin="round" stroke-linecap="round"/>
    <path d="M282 238 H368" fill="none" stroke="#ad4e2a" stroke-width="2.8" stroke-linejoin="round" stroke-linecap="round"/>
    <path class="flow" transform="translate(96 238) rotate(0)" d="M-5 -4.8 L4.5 0 L-5 4.8 Z" fill="#234ac2"/>
    <path class="flow" transform="translate(304 238) rotate(0)" d="M-5 -4.8 L4.5 0 L-5 4.8 Z" fill="#ad4e2a"/>
    <g class="valve"><title>Потребитель — возврат</title><path transform="translate(334 238) rotate(0)" d="M-7.2 -5.3 L0 0 L-7.2 5.3 Z M7.2 -5.3 L0 0 L7.2 5.3 Z" fill="#fff" stroke="#16212c" stroke-width="1.65" stroke-linejoin="round"/></g>
    <g class="consumer"><title>Потребитель</title><rect x="118" y="220" width="164" height="36" rx="2" fill="#fff" stroke="#16212c" stroke-width="1.9"/><text x="200" y="244" text-anchor="middle" font-size="17" font-weight="550" fill="#16212c">Потребитель</text></g>
  </g>
</svg>
