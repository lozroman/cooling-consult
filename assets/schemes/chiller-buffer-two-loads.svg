<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 521" role="img" aria-labelledby="title desc">
  <title id="title">Чиллер — буферная ёмкость и два потребителя</title>
  <desc id="desc">Чиллер и насос 1 соединены с четырёхпатрубковой буферной ёмкостью. Насос 2 подаёт воду из ёмкости к двум параллельным потребителям. У системы один расширительный бак. Подача и возврат чиллера 7 и 12 °C.</desc>
  <g font-family="Inter, Arial, sans-serif" fill="#16212c">
    <path d="M101 40 H32 V231" fill="none" stroke="#234ac2" stroke-width="2.8" stroke-linejoin="round" stroke-linecap="round"/>
    <path d="M299 40 H368 V197" fill="none" stroke="#ad4e2a" stroke-width="2.8" stroke-linejoin="round" stroke-linecap="round"/>
    <g class="source"><rect x="101" y="20" width="198" height="40" rx="2" fill="#fff" stroke="#16212c" stroke-width="1.9"/><text x="200" y="46" text-anchor="middle" font-size="18" font-weight="650" fill="#16212c">Чиллер</text></g>
    <path class="flow" transform="translate(66 40) rotate(180)" d="M-5 -4.8 L4.5 0 L-5 4.8 Z" fill="#234ac2"/>
    <g class="temperatures"><text x="66" y="26" text-anchor="middle" font-size="17" font-weight="650" fill="#234ac2">7 °C</text><text x="335" y="26" text-anchor="middle" font-size="17" font-weight="650" fill="#ad4e2a">12 °C</text></g>
    <path d="M32 231 H101" fill="none" stroke="#234ac2" stroke-width="2.8" stroke-linejoin="round" stroke-linecap="round"/>
    <path d="M299 197 H368" fill="none" stroke="#ad4e2a" stroke-width="2.8" stroke-linejoin="round" stroke-linecap="round"/>
    <path class="flow" transform="translate(335 40) rotate(180)" d="M-5 -4.8 L4.5 0 L-5 4.8 Z" fill="#ad4e2a"/>
    <path class="flow" transform="translate(368 137) rotate(270)" d="M-5 -4.8 L4.5 0 L-5 4.8 Z" fill="#ad4e2a"/>
    <path class="flow" transform="translate(80 231) rotate(0)" d="M-5 -4.8 L4.5 0 L-5 4.8 Z" fill="#234ac2"/>
    <g class="valve"><title>Возврат первичного контура</title><path transform="translate(336 197) rotate(0)" d="M-7.2 -5.3 L0 0 L-7.2 5.3 Z M7.2 -5.3 L0 0 L7.2 5.3 Z" fill="#fff" stroke="#16212c" stroke-width="1.65" stroke-linejoin="round"/></g>
    <path d="M101 251 H32 V477" fill="none" stroke="#234ac2" stroke-width="2.8" stroke-linejoin="round" stroke-linecap="round"/>
    <path d="M299 217 H368 V477" fill="none" stroke="#ad4e2a" stroke-width="2.8" stroke-linejoin="round" stroke-linecap="round"/>
    <path class="flow" transform="translate(79 251) rotate(180)" d="M-5 -4.8 L4.5 0 L-5 4.8 Z" fill="#234ac2"/>
    <path class="flow" transform="translate(368 311) rotate(270)" d="M-5 -4.8 L4.5 0 L-5 4.8 Z" fill="#ad4e2a"/>
    <g class="buffer-tank"><title>Закрытая четырёхпатрубковая ёмкость, общий объём воды</title><rect x="101" y="182" width="198" height="83" rx="13" fill="#fff" stroke="#16212c" stroke-width="1.9"/><path d="M101 231 H109 M101 251 H109" fill="none" stroke="#234ac2" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round"/><path d="M291 197 H299 M291 217 H299" fill="none" stroke="#ad4e2a" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round"/><text x="200" y="229" text-anchor="middle" font-size="17" font-weight="600" fill="#16212c">Буферная ёмкость</text></g>
    <g class="valve"><title>Общий возврат в буферную ёмкость</title><path transform="translate(336 217) rotate(0)" d="M-7.2 -5.3 L0 0 L-7.2 5.3 Z M7.2 -5.3 L0 0 L7.2 5.3 Z" fill="#fff" stroke="#16212c" stroke-width="1.65" stroke-linejoin="round"/></g>
    <g class="valve"><title>Насос 1 — всасывающая линия</title><path transform="translate(32 113) rotate(90)" d="M-7.2 -5.3 L0 0 L-7.2 5.3 Z M7.2 -5.3 L0 0 L7.2 5.3 Z" fill="#fff" stroke="#16212c" stroke-width="1.65" stroke-linejoin="round"/></g>
    <g class="pump"><title>Насос 1</title><circle cx="32" cy="140" r="13.4" fill="#fff" stroke="#234ac2" stroke-width="2.4"/><path d="M23.7 134.3 h16.6 l-8.3 15 Z" fill="#234ac2"/><text x="57" y="145.8" text-anchor="start" font-size="17" font-weight="400" fill="#16212c">Насос 1</text></g>
    <g class="valve"><title>Насос 1 — напорная линия</title><path transform="translate(32 168) rotate(90)" d="M-7.2 -5.3 L0 0 L-7.2 5.3 Z M7.2 -5.3 L0 0 L7.2 5.3 Z" fill="#fff" stroke="#16212c" stroke-width="1.65" stroke-linejoin="round"/></g>
    <g class="expansion"><title>Мембранный бак подключён к всасывающей линии насоса</title><path d="M32 314 H111 V308" fill="none" stroke="#234ac2" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/><circle cx="32" cy="314" r="3.6" fill="#234ac2"/><rect x="96" y="277" width="30" height="31" rx="13" fill="#fff" stroke="#16212c" stroke-width="1.9"/><path d="M97 293 q14 -6 28 0" fill="none" stroke="#16212c" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round"/><text x="137" y="297" text-anchor="start" font-size="16" font-weight="400" fill="#16212c">Расширительный бак</text></g>
    <g class="valve"><title>Насос 2 — всасывающая линия</title><path transform="translate(32 332) rotate(90)" d="M-7.2 -5.3 L0 0 L-7.2 5.3 Z M7.2 -5.3 L0 0 L7.2 5.3 Z" fill="#fff" stroke="#16212c" stroke-width="1.65" stroke-linejoin="round"/></g>
    <g class="pump"><title>Насос 2</title><circle cx="32" cy="359" r="13.4" fill="#fff" stroke="#234ac2" stroke-width="2.4"/><path d="M23.7 353.3 h16.6 l-8.3 15 Z" fill="#234ac2"/><text x="57" y="364.8" text-anchor="start" font-size="17" font-weight="400" fill="#16212c">Насос 2</text></g>
    <g class="valve"><title>Насос 2 — напорная линия</title><path transform="translate(32 387) rotate(90)" d="M-7.2 -5.3 L0 0 L-7.2 5.3 Z M7.2 -5.3 L0 0 L7.2 5.3 Z" fill="#fff" stroke="#16212c" stroke-width="1.65" stroke-linejoin="round"/></g>
    <path d="M32 423 H118" fill="none" stroke="#234ac2" stroke-width="2.8" stroke-linejoin="round" stroke-linecap="round"/>
    <path d="M282 423 H368" fill="none" stroke="#ad4e2a" stroke-width="2.8" stroke-linejoin="round" stroke-linecap="round"/>
    <circle cx="32" cy="423" r="3.6" fill="#234ac2"/>
    <circle cx="368" cy="423" r="3.6" fill="#ad4e2a"/>
    <g class="valve"><title>Потребитель 1 — подача</title><path transform="translate(72 423) rotate(0)" d="M-7.2 -5.3 L0 0 L-7.2 5.3 Z M7.2 -5.3 L0 0 L7.2 5.3 Z" fill="#fff" stroke="#16212c" stroke-width="1.65" stroke-linejoin="round"/></g>
    <path class="flow" transform="translate(96 423) rotate(0)" d="M-5 -4.8 L4.5 0 L-5 4.8 Z" fill="#234ac2"/>
    <path class="flow" transform="translate(304 423) rotate(0)" d="M-5 -4.8 L4.5 0 L-5 4.8 Z" fill="#ad4e2a"/>
    <g class="valve"><title>Потребитель 1 — возврат</title><path transform="translate(334 423) rotate(0)" d="M-7.2 -5.3 L0 0 L-7.2 5.3 Z M7.2 -5.3 L0 0 L7.2 5.3 Z" fill="#fff" stroke="#16212c" stroke-width="1.65" stroke-linejoin="round"/></g>
    <g class="consumer"><title>Потребитель 1</title><rect x="118" y="405" width="164" height="36" rx="2" fill="#fff" stroke="#16212c" stroke-width="1.9"/><text x="200" y="429" text-anchor="middle" font-size="17" font-weight="550" fill="#16212c">Потребитель 1</text></g>
    <path d="M32 477 H118" fill="none" stroke="#234ac2" stroke-width="2.8" stroke-linejoin="round" stroke-linecap="round"/>
    <path d="M282 477 H368" fill="none" stroke="#ad4e2a" stroke-width="2.8" stroke-linejoin="round" stroke-linecap="round"/>
    <g class="valve"><title>Потребитель 2 — подача</title><path transform="translate(72 477) rotate(0)" d="M-7.2 -5.3 L0 0 L-7.2 5.3 Z M7.2 -5.3 L0 0 L7.2 5.3 Z" fill="#fff" stroke="#16212c" stroke-width="1.65" stroke-linejoin="round"/></g>
    <path class="flow" transform="translate(96 477) rotate(0)" d="M-5 -4.8 L4.5 0 L-5 4.8 Z" fill="#234ac2"/>
    <path class="flow" transform="translate(304 477) rotate(0)" d="M-5 -4.8 L4.5 0 L-5 4.8 Z" fill="#ad4e2a"/>
    <g class="valve"><title>Потребитель 2 — возврат</title><path transform="translate(334 477) rotate(0)" d="M-7.2 -5.3 L0 0 L-7.2 5.3 Z M7.2 -5.3 L0 0 L7.2 5.3 Z" fill="#fff" stroke="#16212c" stroke-width="1.65" stroke-linejoin="round"/></g>
    <g class="consumer"><title>Потребитель 2</title><rect x="118" y="459" width="164" height="36" rx="2" fill="#fff" stroke="#16212c" stroke-width="1.9"/><text x="200" y="483" text-anchor="middle" font-size="17" font-weight="550" fill="#16212c">Потребитель 2</text></g>
  </g>
</svg>
