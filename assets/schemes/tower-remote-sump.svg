<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 325" role="img" aria-labelledby="title desc">
  <title id="title">Градирня — выносной бак перед насосом</title>
  <desc id="desc">Из открытой градирни вода самотёком поступает в выносной бак. Насос забирает воду из бака и подаёт потребителю. Обратная линия ведёт на орошение градирни.</desc>
  <g font-family="Inter, Arial, sans-serif" fill="#16212c">
    <path d="M101 40 H32 V111" fill="none" stroke="#234ac2" stroke-width="2.8" stroke-linejoin="round" stroke-linecap="round"/>
    <path d="M299 40 H368 V280" fill="none" stroke="#ad4e2a" stroke-width="2.8" stroke-linejoin="round" stroke-linecap="round"/>
    <g class="source"><rect x="101" y="16" width="198" height="48" rx="2" fill="#fff" stroke="#16212c" stroke-width="1.9"/><text x="200" y="39" text-anchor="middle" font-size="18" font-weight="650" fill="#16212c">Градирня</text><text x="200" y="56" text-anchor="middle" font-size="14" font-weight="400" fill="#475969">сборный поддон</text></g>
    <path class="flow" transform="translate(66 40) rotate(180)" d="M-5 -4.8 L4.5 0 L-5 4.8 Z" fill="#234ac2"/>
    <path class="flow" transform="translate(335 40) rotate(180)" d="M-5 -4.8 L4.5 0 L-5 4.8 Z" fill="#ad4e2a"/>
    <path class="flow" transform="translate(32 99) rotate(90)" d="M-5 -4.8 L4.5 0 L-5 4.8 Z" fill="#234ac2"/>
    <text x="54" y="97" text-anchor="start" font-size="16" font-weight="400" fill="#234ac2">Самотёк</text>
    <path class="flow" transform="translate(368 164) rotate(270)" d="M-5 -4.8 L4.5 0 L-5 4.8 Z" fill="#ad4e2a"/>
    <g class="open-tank"><title>Открытый сборный бак ниже поддона градирни</title><path d="M14 111 V157 H110 V111" fill="#fff" stroke="#16212c" stroke-width="2.1" stroke-linejoin="round"/><path d="M16 128 Q27 124 39 128 T62 128 T85 128 T108 128 V155 H16 Z" fill="#eaf0fc"/><path d="M16 128 Q27 124 39 128 T62 128 T85 128 T108 128" fill="none" stroke="#234ac2" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/><text x="129" y="137" text-anchor="start" font-size="17" font-weight="550" fill="#16212c">Выносной бак</text></g>
    <path d="M32 157 V280" fill="none" stroke="#234ac2" stroke-width="2.8" stroke-linejoin="round" stroke-linecap="round"/>
    <g class="valve"><title>Насос — всасывающая линия</title><path transform="translate(32 185) rotate(90)" d="M-7.2 -5.3 L0 0 L-7.2 5.3 Z M7.2 -5.3 L0 0 L7.2 5.3 Z" fill="#fff" stroke="#16212c" stroke-width="1.65" stroke-linejoin="round"/></g>
    <g class="pump"><title>Насос</title><circle cx="32" cy="212" r="13.4" fill="#fff" stroke="#234ac2" stroke-width="2.4"/><path d="M23.7 206.3 h16.6 l-8.3 15 Z" fill="#234ac2"/><text x="57" y="217.8" text-anchor="start" font-size="17" font-weight="400" fill="#16212c">Насос</text></g>
    <g class="valve"><title>Насос — напорная линия</title><path transform="translate(32 240) rotate(90)" d="M-7.2 -5.3 L0 0 L-7.2 5.3 Z M7.2 -5.3 L0 0 L7.2 5.3 Z" fill="#fff" stroke="#16212c" stroke-width="1.65" stroke-linejoin="round"/></g>
    <path d="M32 280 H118" fill="none" stroke="#234ac2" stroke-width="2.8" stroke-linejoin="round" stroke-linecap="round"/>
    <path d="M282 280 H368" fill="none" stroke="#ad4e2a" stroke-width="2.8" stroke-linejoin="round" stroke-linecap="round"/>
    <path class="flow" transform="translate(96 280) rotate(0)" d="M-5 -4.8 L4.5 0 L-5 4.8 Z" fill="#234ac2"/>
    <path class="flow" transform="translate(304 280) rotate(0)" d="M-5 -4.8 L4.5 0 L-5 4.8 Z" fill="#ad4e2a"/>
    <g class="valve"><title>Потребитель — возврат</title><path transform="translate(334 280) rotate(0)" d="M-7.2 -5.3 L0 0 L-7.2 5.3 Z M7.2 -5.3 L0 0 L7.2 5.3 Z" fill="#fff" stroke="#16212c" stroke-width="1.65" stroke-linejoin="round"/></g>
    <g class="consumer"><title>Потребитель</title><rect x="118" y="262" width="164" height="36" rx="2" fill="#fff" stroke="#16212c" stroke-width="1.9"/><text x="200" y="286" text-anchor="middle" font-size="17" font-weight="550" fill="#16212c">Потребитель</text></g>
  </g>
</svg>
