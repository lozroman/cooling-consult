<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 462" role="img" aria-labelledby="title desc">
  <title id="title">Чиллер — теплообменник и один потребитель</title>
  <desc id="desc">Два замкнутых контура через теплообменник. В каждом свой насос и расширительный бак. На стороне чиллера 7 °C на подаче и 12 °C на возврате.</desc>
  <g font-family="Inter, Arial, sans-serif" fill="#16212c">
    <path d="M101 40 H32 V208" fill="none" stroke="#234ac2" stroke-width="2.8" stroke-linejoin="round" stroke-linecap="round"/>
    <path d="M299 40 H368 V208" fill="none" stroke="#ad4e2a" stroke-width="2.8" stroke-linejoin="round" stroke-linecap="round"/>
    <g class="source"><rect x="101" y="20" width="198" height="40" rx="2" fill="#fff" stroke="#16212c" stroke-width="1.9"/><text x="200" y="46" text-anchor="middle" font-size="18" font-weight="650" fill="#16212c">Чиллер</text></g>
    <path class="flow" transform="translate(66 40) rotate(180)" d="M-5 -4.8 L4.5 0 L-5 4.8 Z" fill="#234ac2"/>
    <g class="temperatures"><text x="66" y="26" text-anchor="middle" font-size="17" font-weight="650" fill="#234ac2">7 °C</text><text x="335" y="26" text-anchor="middle" font-size="17" font-weight="650" fill="#ad4e2a">12 °C</text></g>
    <path d="M32 208 H98" fill="none" stroke="#234ac2" stroke-width="2.8" stroke-linejoin="round" stroke-linecap="round"/>
    <path d="M302 208 H368" fill="none" stroke="#ad4e2a" stroke-width="2.8" stroke-linejoin="round" stroke-linecap="round"/>
    <path class="flow" transform="translate(335 40) rotate(180)" d="M-5 -4.8 L4.5 0 L-5 4.8 Z" fill="#ad4e2a"/>
    <path class="flow" transform="translate(368 137) rotate(270)" d="M-5 -4.8 L4.5 0 L-5 4.8 Z" fill="#ad4e2a"/>
    <path class="flow" transform="translate(80 208) rotate(0)" d="M-5 -4.8 L4.5 0 L-5 4.8 Z" fill="#234ac2"/>
    <g class="valve"><title>Возврат первичного контура</title><path transform="translate(336 208) rotate(0)" d="M-7.2 -5.3 L0 0 L-7.2 5.3 Z M7.2 -5.3 L0 0 L7.2 5.3 Z" fill="#fff" stroke="#16212c" stroke-width="1.65" stroke-linejoin="round"/></g>
    <path d="M98 244 H32 V418" fill="none" stroke="#234ac2" stroke-width="2.8" stroke-linejoin="round" stroke-linecap="round"/>
    <path d="M302 244 H368 V418" fill="none" stroke="#ad4e2a" stroke-width="2.8" stroke-linejoin="round" stroke-linecap="round"/>
    <path class="flow" transform="translate(79 244) rotate(180)" d="M-5 -4.8 L4.5 0 L-5 4.8 Z" fill="#234ac2"/>
    <path class="flow" transform="translate(368 338) rotate(270)" d="M-5 -4.8 L4.5 0 L-5 4.8 Z" fill="#ad4e2a"/>
    <g class="heat-exchanger"><title>Четыре присоединения, два раздельных контура</title><rect x="98" y="190" width="204" height="72" rx="2" fill="#fff" stroke="#16212c" stroke-width="1.9"/><path d="M98 208 H111 M98 244 H111" fill="none" stroke="#234ac2" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round"/><path d="M289 208 H302 M289 244 H302" fill="none" stroke="#ad4e2a" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round"/><path d="M110 235 l6 -18 m-1 18 l6 -18 m-1 18 l6 -18" fill="none" stroke="#475969" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/><text x="210" y="232" text-anchor="middle" font-size="18" font-weight="600" fill="#16212c">Теплообменник</text></g>
    <path class="flow" transform="translate(335 244) rotate(180)" d="M-5 -4.8 L4.5 0 L-5 4.8 Z" fill="#ad4e2a"/>
    <g class="expansion"><title>Мембранный бак подключён к всасывающей линии насоса</title><path d="M32 110 H111 V104" fill="none" stroke="#234ac2" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/><circle cx="32" cy="110" r="3.6" fill="#234ac2"/><rect x="96" y="73" width="30" height="31" rx="13" fill="#fff" stroke="#16212c" stroke-width="1.9"/><path d="M97 89 q14 -6 28 0" fill="none" stroke="#16212c" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round"/><text x="137" y="93" text-anchor="start" font-size="16" font-weight="400" fill="#16212c">Расширительный бак 1</text></g>
    <g class="valve"><title>Насос 1 — всасывающая линия</title><path transform="translate(32 126) rotate(90)" d="M-7.2 -5.3 L0 0 L-7.2 5.3 Z M7.2 -5.3 L0 0 L7.2 5.3 Z" fill="#fff" stroke="#16212c" stroke-width="1.65" stroke-linejoin="round"/></g>
    <g class="pump"><title>Насос 1</title><circle cx="32" cy="153" r="13.4" fill="#fff" stroke="#234ac2" stroke-width="2.4"/><path d="M23.7 147.3 h16.6 l-8.3 15 Z" fill="#234ac2"/><text x="57" y="158.8" text-anchor="start" font-size="17" font-weight="400" fill="#16212c">Насос 1</text></g>
    <g class="valve"><title>Насос 1 — напорная линия</title><path transform="translate(32 181) rotate(90)" d="M-7.2 -5.3 L0 0 L-7.2 5.3 Z M7.2 -5.3 L0 0 L7.2 5.3 Z" fill="#fff" stroke="#16212c" stroke-width="1.65" stroke-linejoin="round"/></g>
    <g class="expansion"><title>Мембранный бак подключён к всасывающей линии насоса</title><path d="M32 307 H111 V301" fill="none" stroke="#234ac2" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/><circle cx="32" cy="307" r="3.6" fill="#234ac2"/><rect x="96" y="270" width="30" height="31" rx="13" fill="#fff" stroke="#16212c" stroke-width="1.9"/><path d="M97 286 q14 -6 28 0" fill="none" stroke="#16212c" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round"/><text x="137" y="290" text-anchor="start" font-size="16" font-weight="400" fill="#16212c">Расширительный бак 2</text></g>
    <g class="valve"><title>Насос 2 — всасывающая линия</title><path transform="translate(32 325) rotate(90)" d="M-7.2 -5.3 L0 0 L-7.2 5.3 Z M7.2 -5.3 L0 0 L7.2 5.3 Z" fill="#fff" stroke="#16212c" stroke-width="1.65" stroke-linejoin="round"/></g>
    <g class="pump"><title>Насос 2</title><circle cx="32" cy="352" r="13.4" fill="#fff" stroke="#234ac2" stroke-width="2.4"/><path d="M23.7 346.3 h16.6 l-8.3 15 Z" fill="#234ac2"/><text x="57" y="357.8" text-anchor="start" font-size="17" font-weight="400" fill="#16212c">Насос 2</text></g>
    <g class="valve"><title>Насос 2 — напорная линия</title><path transform="translate(32 380) rotate(90)" d="M-7.2 -5.3 L0 0 L-7.2 5.3 Z M7.2 -5.3 L0 0 L7.2 5.3 Z" fill="#fff" stroke="#16212c" stroke-width="1.65" stroke-linejoin="round"/></g>
    <path d="M32 418 H118" fill="none" stroke="#234ac2" stroke-width="2.8" stroke-linejoin="round" stroke-linecap="round"/>
    <path d="M282 418 H368" fill="none" stroke="#ad4e2a" stroke-width="2.8" stroke-linejoin="round" stroke-linecap="round"/>
    <path class="flow" transform="translate(96 418) rotate(0)" d="M-5 -4.8 L4.5 0 L-5 4.8 Z" fill="#234ac2"/>
    <path class="flow" transform="translate(304 418) rotate(0)" d="M-5 -4.8 L4.5 0 L-5 4.8 Z" fill="#ad4e2a"/>
    <g class="valve"><title>Потребитель — возврат</title><path transform="translate(334 418) rotate(0)" d="M-7.2 -5.3 L0 0 L-7.2 5.3 Z M7.2 -5.3 L0 0 L7.2 5.3 Z" fill="#fff" stroke="#16212c" stroke-width="1.65" stroke-linejoin="round"/></g>
    <g class="consumer"><title>Потребитель</title><rect x="118" y="400" width="164" height="36" rx="2" fill="#fff" stroke="#16212c" stroke-width="1.9"/><text x="200" y="424" text-anchor="middle" font-size="17" font-weight="550" fill="#16212c">Потребитель</text></g>
  </g>
</svg>
